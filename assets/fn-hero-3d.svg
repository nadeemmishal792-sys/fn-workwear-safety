<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Original industrial worksite photograph with subtle cinematic motion">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#081011" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#081011" stop-opacity=".04"/>
      <stop offset="1" stop-color="#081011" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="light" cx="78%" cy="38%" r="58%">
      <stop offset="0" stop-color="#d6ed70" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#c8df36" stop-opacity=".045"/>
      <stop offset="1" stop-color="#c8df36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#e4f4a0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#17201e"/>
  <g transform-origin="960px 540px">
    <image x="-90" y="-55" width="2100" height="1180" preserveAspectRatio="xMidYMid slice"
      href="https://thecreativeconcept.org/assets/images/workwear-showcase.webp"
      xlink:href="https://thecreativeconcept.org/assets/images/workwear-showcase.webp"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.065;1.035;1" dur="30s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-18 9;10 -7;0 0" dur="36s" repeatCount="indefinite" additive="sum"/>
  </g>
  <rect width="1920" height="1080" fill="url(#shade)"/>
  <rect width="1920" height="1080" fill="url(#light)">
    <animate attributeName="opacity" values=".55;1;.7;.55" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="-1920" y="0" width="1920" height="1080" fill="url(#sweep)" opacity=".45">
    <animate attributeName="x" values="-1920;1920" dur="22s" repeatCount="indefinite"/>
  </rect>
</svg>