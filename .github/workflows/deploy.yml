name: Build and deploy FN website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate website
        run: |
          test -s index.html
          test -s favicon.svg
          test -s robots.txt
          test -s sitemap.xml
          node tests/showroom-smoke.mjs
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html favicon.svg robots.txt sitemap.xml dist/
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
