name: Build and deploy FN website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate website assets
        run: |
          test -s index.html
          test -s product-experience.js
          grep -q 'product-experience.js' index.html
          node --check product-experience.js
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html product-experience.js favicon.svg robots.txt sitemap.xml dist/
          test -s dist/product-experience.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: ${{ vars.PUBLISH_SITE == 'true' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
