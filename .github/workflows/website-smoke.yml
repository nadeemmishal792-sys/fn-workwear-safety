name: Website smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "phase-1/**"

jobs:
  showroom-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run showroom smoke checks
        run: node tests/showroom-smoke.mjs
